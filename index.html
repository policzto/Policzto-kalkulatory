<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POLICZTO | Kalkulator oszczędności</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fc;color:#20243a}
header{background:linear-gradient(135deg,#6330dc,#3986ed);color:white;padding:28px 20px 55px;text-align:center}
.logo{letter-spacing:5px;font-size:22px}
h1{font-size:29px;margin:45px 0 12px}
header p{font-size:17px;line-height:1.5}
main{max-width:580px;margin:-25px auto 40px;padding:0 15px}
.card{background:white;border-radius:22px;padding:25px 20px;box-shadow:0 8px 35px #16214b18}
h2{font-size:24px;margin-top:0}
.desc{color:#646a7d;line-height:1.6}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:24px 0}
.tabs button{border:0;border-radius:12px;padding:14px 8px;background:#edf0fa;color:#31364b;font-weight:bold}
.tabs button.active{background:#5937d7;color:white}
label{display:block;margin:18px 0 7px;font-weight:bold;font-size:14px}
input,select{width:100%;padding:15px;border:1px solid #cbd1e0;border-radius:11px;font-size:17px;background:white;color:#20243a}
.calculate{width:100%;padding:17px;margin-top:24px;border:0;border-radius:30px;background:#111026;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.result{margin-top:25px;padding:22px;background:#eeebff;border-radius:16px;text-align:center}
.result strong{display:block;font-size:32px;color:#5430ce;margin:12px 0;overflow-wrap:anywhere}
.result p{line-height:1.5}
small{color:#666b80}
footer{text-align:center;padding:20px;color:#73788a;font-size:13px}
</style>
</head>
<body>
<header>
<div class="logo">POLICZTO</div>
<h1>Policz, zanim podejmiesz decyzję.</h1>
<p>Proste kalkulatory. Mądrzejsze decyzje.</p>
</header>
<main>
<div class="card">
<h2>Kalkulator oszczędności</h2>
<p class="desc">Sprawdź, ile możesz odłożyć lub ile musisz oszczędzać, aby osiągnąć swój cel.</p>
<div class="tabs">
<button id="tab1" class="active" onclick="setMode(1)">Ile uzbieram?</button>
<button id="tab2" onclick="setMode(2)">Ile odkładać?</button>
</div>
<div id="form1">
<label for="amount">Odkładam miesięcznie (zł)</label>
<input id="amount" type="number" min="0" step="0.01" value="500">
</div>
<div id="form2" hidden>
<label for="goal">Chcę uzbierać (zł)</label>
<input id="goal" type="number" min="0" step="0.01" value="30000">
</div>
<label for="years">Okres oszczędzania</label>
<select id="years">
<option value="1">1 rok</option>
<option value="2">2 lata</option>
<option value="3">3 lata</option>
<option value="5" selected>5 lat</option>
<option value="10">10 lat</option>
<option value="15">15 lat</option>
<option value="20">20 lat</option>
<option value="30">30 lat</option>
</select>
<button class="calculate" onclick="calculate()">OBLICZ</button>
<div id="result" class="result" aria-live="polite">
<p>Twój wynik pojawi się tutaj.</p>
</div>
</div>
</main>
<footer>© POLICZTO | Darmowe kalkulatory finansowe</footer>
<script>
let mode=1;
const money=n=>new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'}).format(n);
function setMode(m){
mode=m;
document.getElementById('form1').hidden=m!==1;
document.getElementById('form2').hidden=m!==2;
document.getElementById('tab1').classList.toggle('active',m===1);
document.getElementById('tab2').classList.toggle('active',m===2);
document.getElementById('result').innerHTML='<p>Wpisz dane i kliknij OBLICZ.</p>';
}
function calculate(){
const months=Number(document.getElementById('years').value)*12;
const value=Number(document.getElementById(mode===1?'amount':'goal').value);
const result=document.getElementById('result');
if(!Number.isFinite(value)||value<=0){
result.textContent='Wpisz kwotę większą od zera.';
return;
}
if(mode===1){
const total=value*months;
result.innerHTML='<p>Po '+(months/12)+' latach uzbierasz:</p><strong>'+money(total)+'</strong><p>Łączna suma Twoich wpłat, bez odsetek.</p>';
}else{
const monthly=value/months;
result.innerHTML='<p>Aby osiągnąć swój cel, odkładaj miesięcznie:</p><strong>'+money(monthly)+'</strong><p>Przez '+(months/12)+' lat, bez uwzględnienia odsetek.</p>';
}
}
</script>
</body>
</html>
